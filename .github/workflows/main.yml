name: Build Mustawda APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted
            if [ -f extracted/settings.gradle ]; then
              cp -a extracted/. .
            else
              PROJECT_DIR=$(find extracted -name settings.gradle -print -quit | xargs -r dirname)
              if [ -z "$PROJECT_DIR" ]; then
                echo "No Android project found inside ZIP"
                exit 1
              fi
              cp -a "$PROJECT_DIR"/. .
            fi
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Check Android project
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mustawda-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
