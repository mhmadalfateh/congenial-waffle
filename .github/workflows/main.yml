name: Build Mustawda APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل ملفات المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. الموافقة على تراخيص Android وتثبيت الأدوات
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses || true
          set -o pipefail

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. التحقق من ملفات المشروع
      - name: Check project files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

      # 6. بناء APK
      - name: Build APK
        run: gradle --no-daemon assembleDebug

      # 7. رفع APK للتنزيل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mustawda-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
