name: Build Mustawda APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          if [ -f extracted/settings.gradle ]; then
            cp -a extracted/. .
          else
            PROJECT_DIR=$(find extracted -name settings.gradle -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: No Android project found inside ZIP."
              find extracted -maxdepth 4 -type f
              exit 1
            fi

            cp -a "$PROJECT_DIR"/. .
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mustawda-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
